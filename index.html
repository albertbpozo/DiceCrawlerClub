<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dice Crawler Club</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎲 Dice Crawler Club</h1>
    <button id="btn-reiniciar" class="secundario">Nueva partida</button>
  </header>

  <main>
    <section id="escena">
      <h2 id="escena-titulo"></h2>
      <div id="jefe-barra" hidden></div>
      <div id="escena-texto"></div>
      <div id="tirada" hidden></div>
      <div id="opciones"></div>
    </section>

    <aside id="ficha">
      <div id="progreso"></div>
      <h3>Personaje</h3>
      <div id="stats"></div>
      <h3>Inventario</h3>
      <ul id="inventario"></ul>
      <h3>Registro de tiradas</h3>
      <ol id="registro"></ol>
    </aside>
  </main>

  <script src="js/dados.js"></script>
  <script src="js/contenido.js"></script>
  <script src="js/historias.js"></script>
  <script src="js/motor.js"></script>
</body>
</html>
